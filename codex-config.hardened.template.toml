# Safe shared defaults for Codex CLI, with the comments spelled out.
# Codex CLI 向けの、安全寄りな共通デフォルト（注釈つき）。
#
# Same posture as codex_config_min_safe_template.toml, with web search also
# closed. This is for work that must not read anything external, and closing it
# removes ordinary research. If that is not the work at hand, use
# codex_config_min_safe_template.toml, which sets "indexed" so that looking
# things up still works.
# min_safe 版と同じ姿勢に、Web 検索の遮断を加えたもの。外部を一切読ませたくない
# 作業向けで、閉じると通常の調べ物はできなくなる。そうでなければ、調べ物が成立する
# "indexed" を採る codex_config_min_safe_template.toml のほうを使う。
#
# Design goals:
# 設計方針:
# - keep writes limited to the workspace
# - 書き込みをワークスペース内に限定する
# - require approval for impactful actions
# - 影響の大きい操作は承認必須にする
# - disable network unless explicitly enabled via profile
# - ネットワークは profile で明示しない限り無効にする
# - keep local history for usability, but know the tradeoff
# - ローカル履歴は利便性のため保存しつつ、トレードオフを理解する

# Model is deliberately not pinned: names go stale, and the choice is not a
# hardening control.
# モデル名はあえて固定しない。世代ごとに古くなるうえ、ハードニングの要素ではない。
approval_policy = "on-request"
sandbox_mode = "workspace-write"
allow_login_shell = false
model_reasoning_effort = "medium"

# Web search defaults to "cached", so external text reaches the model even with
# the network closed. This template closes that route as well.
# web_search のデフォルトは "cached"。ネットワークを閉じても外部テキストは届くので、
# このテンプレートではその経路も閉じる。
web_search = "disabled"

# Keep credentials in the OS keychain rather than a plaintext auth.json.
# The CLI store defaults to "file"; MCP OAuth defaults to "auto".
# These lines change where new credentials go; they do not migrate the old ones.
# Log in again, confirm `codex login status`, then check auth.json is gone.
# 資格情報は平文の auth.json ではなく OS キーチェーンに置く。CLI 側のデフォルトは
# "file"。この行だけでは移行しないので、再ログインまで済ませて auth.json を確認する。
cli_auth_credentials_store = "keyring"
mcp_oauth_credentials_store = "keyring"

# Usage metrics are sent unless this is set, even when logged out.
# 書かないと利用メトリクスが送信される（未ログインでも送られる）。
[analytics]
enabled = false

[otel]
# Keep this closed too, in case the link between analytics and metrics changes.
# analytics との連動が将来変わっても閉じたままにするため、こちらも指定する。
metrics_exporter = "none"

# Persist local input history for day-to-day usability.
# 日常利用のため、ローカルの入力履歴は保存する。
# If you prefer not to retain history, change this to "none".
# 履歴を残したくない場合は、ここを "none" に変更する。
# NOTE: this only controls history.jsonl. Full session transcripts go to
# $CODEX_HOME/sessions/ and cannot be turned off in config. Use
# `codex exec --ephemeral`, or `codex delete <ID>` after sensitive work.
# 注意: これは history.jsonl だけの設定。セッション全文は sessions/ に残り、
# 設定では止められない。作業後に codex delete するか、--ephemeral を使う。
[history]
persistence = "save-all"

# Workspace-write sandbox with no extra writable paths and no network.
# 追加の書き込み先を認めず、ネットワークも無効な workspace-write。
[sandbox_workspace_write]
network_access = false
exclude_slash_tmp = true
exclude_tmpdir_env_var = true
writable_roots = []

# Limit what of your environment is inherited by spawned commands.
# The defaults are NOT safe: inherit defaults to "all", and
# ignore_default_excludes defaults to true (no name-based filtering at all).
# The name filter only covers *KEY* / *SECRET* / *TOKEN*; PGPASSWORD and
# DATABASE_URL pass through. Treat it as a fallback, not the main protection.
# 子プロセスへ引き継ぐ環境変数を絞る。デフォルトは全継承・除外なしで安全側ではない。
# 名前による除外は *KEY* / *SECRET* / *TOKEN* の 3 パターンだけ。
[shell_environment_policy]
inherit = "core"
ignore_default_excludes = false

# Stop the shell snapshot from being written at all. A login shell would load a
# snapshot of the full Codex environment that shell_environment_policy does not
# filter; allow_login_shell = false already blocks that path, and this also stops
# the plaintext snapshot file under $CODEX_HOME/shell_snapshots/.
# Key confirmed present on 0.146.0. Cost: shell functions, aliases and PATH from
# your login shell are no longer carried into commands.
# snapshot ファイルの生成自体を止める。0.146.0 で存在を確認したキー。
# 代償として、login shell の関数・エイリアス・PATH が引き継がれなくなる。
[features]
shell_snapshot = false

# Close the memories surface even though its feature gate is off today,
# so a future default-on change does not open it silently.
# memories は今はゲートが無効だが、将来デフォルトで有効になっても開かないようにする。
[memories]
use_memories = false
generate_memories = false
disable_on_external_context = true

# Profiles are one file each: $CODEX_HOME/<name>.config.toml, selected with
# `codex --profile <name>` and layered over this file. Because a profile file is
# a full config layer, it may contain [sandbox_workspace_write] and [history].
# profile は 1 つにつき 1 ファイル。$CODEX_HOME/<名前>.config.toml を置き、
# `codex --profile <名前>` で選ぶ。設定ファイルそのものなので
# [sandbox_workspace_write] や [history] もそのまま書ける。
#
# ~/.codex/readonly_quiet.config.toml
#     approval_policy = "never"
#     sandbox_mode    = "read-only"
#
# ~/.codex/local_write.config.toml
#     approval_policy = "on-request"
#     sandbox_mode    = "workspace-write"
#
# ~/.codex/remote_enabled.config.toml   (open the network only when needed)
#     approval_policy = "on-request"
#     sandbox_mode    = "workspace-write"
#     [sandbox_workspace_write]
#     network_access  = true
#     writable_roots  = []

# Notes:
# 補足:
# - Never write secret values in this file. Record the name of an environment
#   variable instead (mcp_servers.<id>.bearer_token_env_var, env_http_headers)
#   and inject the value at launch from a keychain or secret manager.
# - この設定ファイルにシークレットの値を書かない。環境変数名だけを書き、
#   値はキーチェーンやシークレットマネージャから起動時に注入する。
# - Verify with `codex sandbox --log-denials -- <command>` (macOS).
# - 効いているかは `codex sandbox --log-denials -- <コマンド>` で確かめる（macOS）。
# - The beta permission profiles (default_permissions / [permissions.*]) do not
#   combine with sandbox_mode / [sandbox_workspace_write]. Pick one model.
#   Verified on 0.146.0: when both appear, default_permissions WINS and silently
#   overrides sandbox_mode above. Remove it after experimenting with the beta.
# - beta の権限プロファイルは sandbox_mode 系と併用できない。どちらか一方を選ぶ。
#   0.146.0 で確認: 併記すると default_permissions 側が勝ち、上の sandbox_mode を
#   警告なく上書きする。beta を試したら消し忘れないこと。
# - Do not export secrets into the shell you start Codex from. hooks and notify
#   run outside shell_environment_policy and inherit the Codex environment.
# - Codex を起動するシェルにシークレットを export しない。hooks と notify は
#   shell_environment_policy の外で Codex の環境をそのまま受け取る。
# - Treat $CODEX_HOME as a secrets directory: `chmod 700 ~/.codex`. Sessions and
#   shell snapshots are not created with a fixed restrictive mode.
# - $CODEX_HOME はまるごと機密ディレクトリとして扱う（chmod 700 ~/.codex）。
#   セッションやスナップショットは固定の厳しい権限では作られない。
# - Marking a repository as trusted hands it config precedence: a trusted
#   project's .codex/config.toml can override the settings in this file.
# - リポジトリを trusted にすると設定の優先権を渡すことになる。trusted な
#   プロジェクトの .codex/config.toml はこのファイルの設定を上書きできる。
